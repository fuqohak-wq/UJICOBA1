<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yayasan Yahyawiyyah V2.5 - Panel Kendali</title>
    <style>
        body {
            background-color: #051d14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 550px;
            background-color: #03140e;
            padding: 20px;
            border-radius: 12px;
            border-top: 4px solid #f39c12;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .header {
            margin-bottom: 25px;
        }
        .header h5 {
            color: #f39c12;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
        }
        .header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .panel-title {
            background-color: #08291d;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 15px;
        }
        .logout-btn {
            color: #ff7675;
            text-decoration: none;
            font-size: 14px;
        }
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .tab-pending {
            background-color: #112a20;
            color: #a4b0be;
        }
        .tab-active {
            background-color: #096343 !important;
            color: white !important;
        }
        .tab-badge {
            background-color: #ff3333;
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 11px;
            margin-left: 3px;
        }
        .card {
            background-color: #0a1f18;
            border: 1px solid #123327;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
        }
        .card-riwayat {
            background-color: #11231b;
            border-left: 4px solid #2ecc71;
        }
        .card .nama-santri {
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 8px 0;
            color: #ffffff;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .status-lunas { background-color: #2ed573; color: #051d14; }
        .status-ditolak { background-color: #ff4757; color: white; }
        
        .alert-box {
            background-color: rgba(255, 51, 51, 0.15);
            border: 1px dashed #ff3333;
            color: #ff7675;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .alert-box-warn {
            background-color: rgba(243, 156, 18, 0.1);
            border: 1px dashed #f39c12;
            color: #f39c12;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .btn-action {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
            text-decoration: none;
            margin-bottom: 10px;
        }
        .btn-struk {
            background-color: #04120e;
            color: #3498db;
            border: 1px solid #1d332c;
        }
        .input-nominal {
            width: 100%;
            padding: 12px;
            background-color: #04120e;
            border: 1px solid #163a2c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            border-radius: 6px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .btn-acc {
            background-color: #096343;
            color: white;
        }
        .btn-acc:hover { background-color: #0b754f; }
        
        .fraud-action-group {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 8px;
        }
        .btn-tolak-keras {
            background-color: #b33939;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-tolak-keras:hover { background-color: #ff5252; }
        
        .btn-cancel-view {
            background-color: #4b4b4b;
            color: #ffffff;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-cancel-view:hover { background-color: #777777; }

        /* AREA LOADING & ENGINE SPINNER ANIMASI */
        .loading-box {
            display: none;
            text-align: center;
            padding: 30px 15px;
            background-color: #04120e;
            border-radius: 10px;
            border: 1px solid #163a2c;
            margin-bottom: 20px;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 5px solid rgba(243, 156, 18, 0.2);
            border-top: 5px solid #f39c12;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .kisah-container {
            background-color: #08291d;
            border-left: 3px solid #f39c12;
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            margin-top: 15px;
        }
        .kisah-header {
            font-size: 11px;
            color: #f39c12;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        .kisah-teks {
            font-size: 13px;
            color: #e0e0e0;
            line-height: 1.5;
            font-style: italic;
            margin: 0;
        }
        .loading-text {
            color: #f39c12;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h5>YAYASAN YAHYAWIYYAH V2.5</h5>
        <h2>GEMINI AI LIGHTWEIGHT ENGINE</h2>
    </div>

    <div class="panel-title">
        <span>🎛️ PANEL KENDALI V2.5</span>
        <a href="#" class="logout-btn">Keluar</a>
    </div>

    <div class="tabs">
        <button class="tab-btn tab-pending tab-active" id="btn-tab-pending" onclick="switchTab('pending')">
            📥 Antrean Pending <span class="tab-badge" id="badge-count">0</span>
        </button>
        <button class="tab-btn tab-pending" id="btn-tab-riwayat" onclick="switchTab('riwayat')">
            📊 Log Riwayat
        </button>
    </div>

    <!-- SPINNER LOADING DENGAN INTEGRASI KISAH ISLAMI -->
    <div id="loading-status-box" class="loading-box">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-message">Menghubungkan ke Google Sheets...</div>
        <div class="kisah-container" id="box-kisah-islami" style="display:none;">
            <div class="kisah-header">📖 Sembari Menunggu, Yuk Baca Kisah Hikmah:</div>
            <p class="kisah-teks" id="teks-kisah">Memuat lembar kisah hikmah dari server...</p>
        </div>
    </div>

    <!-- AREA KARTU DATA -->
    <div id="area-antrean-list"></div>
</div>

<script>
    const URL_GAS_SYSTEM = "https://script.google.com/macros/s/AKfycbzpK04TsH4GJQyWZAHthJ0_lMVZhe_c-CE59biUz4hKREuEPFkv2hBJVq76n2pmNaQ79g/exec"; 
    
    let cacheAntrean = [];
    let currentTab = 'pending';

    document.addEventListener("DOMContentLoaded", () => {
        muatDataAdminSistem();
    });

    // Mengubah tampilan Tab Menu secara interaktif
    function switchTab(targetTab) {
        currentTab = targetTab;
        document.getElementById("btn-tab-pending").classList.remove("tab-active");
        document.getElementById("btn-tab-riwayat").classList.remove("tab-active");

        if(targetTab === 'pending') {
            document.getElementById("btn-tab-pending").classList.add("tab-active");
            renderAntreanKeLayar(cacheAntrean);
        } else {
            document.getElementById("btn-tab-riwayat").classList.add("tab-active");
            muatLogRiwayatSistem();
        }
    }

    // Tampilkan Spinner Loading beserta Teks Cerita Islami Acak
    function tampilkanLoading(pesan) {
        document.getElementById("loading-status-box").style.display = "block";
        document.getElementById("loading-message").innerText = pesan;
        document.getElementById("area-antrean-list").innerHTML = "";
        
        // Panggil Engine Kisah Islami dari Spreadsheet
        fetch(`${URL_GAS_SYSTEM}?aksi=ambilKisahIslami`)
        .then(r => r.json())
        .then(data => {
            if(data.status === "success" && data.kisah) {
                document.getElementById("box-kisah-islami").style.display = "block";
                document.getElementById("teks-kisah").innerText = data.kisah;
            }
        }).catch(() => {
            // Jika sheet kisah kosong/error, sembunyikan kotak tanpa merusak aplikasi
            document.getElementById("box-kisah-islami").style.display = "none";
        });
    }

    function sembunyikanLoading() {
        document.getElementById("loading-status-box").style.display = "none";
    }

    // Fungsi Ambil Antrean Pending
    function muatDataAdminSistem() {
        tampilkanLoading("Mengunduh antrean transaksi terbaru...");

        fetch(`${URL_GAS_SYSTEM}?aksi=ambilDataAdminLengkap`)
        .then(response => response.json())
        .then(res => {
            sembunyikanLoading();
            if(res.status === "success") {
                cacheAntrean = res.antrean || [];
                document.getElementById("badge-count").innerText = cacheAntrean.length;
                if(currentTab === 'pending') renderAntreanKeLayar(cacheAntrean);
            } else {
                document.getElementById("area-antrean-list").innerHTML = `<p style="color:red; text-align:center;">Gagal: ${res.message}</p>`;
            }
        })
        .catch(err => {
            sembunyikanLoading();
            document.getElementById("area-antrean-list").innerHTML = `<p style="color:#ff4d4d; text-align:center; font-weight:bold;">Eror Jaringan Server (Failed to fetch)</p>`;
        });
    }

    // KELOLA LOG RIWAYAT TRANSAKSI AKTIF
    function muatLogRiwayatSistem() {
        tampilkanLoading("Menyusun log riwayat pembukuan...");

        fetch(`${URL_GAS_SYSTEM}?aksi=ambilLogRiwayatLengkap`)
        .then(r => r.json())
        .then(res => {
            sembunyikanLoading();
            const kontainer = document.getElementById("area-antrean-list");
            
            if(res.status !== "success" || !res.riwayat || res.riwayat.length === 0) {
                kontainer.innerHTML = `<p style="text-align:center; color:#aaa; padding:20px;">Belum ada riwayat transaksi yang tersimpan.</p>`;
                return;
            }

            res.riwayat.forEach(log => {
                const badgeStatus = log.status === 'LUNAS' || log.status === 'SUCCESS' 
                    ? `<span class="status-badge status-lunas">✓ Lunas</span>` 
                    : `<span class="status-badge status-ditolak">🗙 Ditolak</span>`;

                kontainer.innerHTML += `
                    <div class="card card-riwayat">
                        <div class="nama-santri">${log.nama.toLowerCase()}</div>
                        ${badgeStatus}
                        <div style="font-size: 14px; color: #f39c12; font-weight: bold; margin-bottom: 5px;">
                            Rp ${Number(log.nominal_total || 0).toLocaleString('id-ID')}
                        </div>
                        <div style="font-size: 11px; color: #888;">ID: ${log.id_trx} | Tgl: ${log.tanggal || '-'}</div>
                    </div>
                `;
            });
        })
        .catch(err => {
            sembunyikanLoading();
            document.getElementById("area-antrean-list").innerHTML = `<p style="color:red; text-align:center;">Gagal mengambil riwayat.</p>`;
        });
    }

    // Render Data Antrean Pending ke Layar
    function renderAntreanKeLayar(daftarAntrean) {
        const kontainer = document.getElementById("area-antrean-list");
        kontainer.innerHTML = "";
        
        if (daftarAntrean.length === 0) {
            kontainer.innerHTML = `<p style="text-align:center; color:#a4b0be; padding:20px;">🎉 Semua antrean bersih!</p>`;
            return;
        }

        daftarAntrean.forEach(item => {
            let infoBlokirHtml = "";
            let areaKontrolAksiHtml = "";

            if (item.alasan_pending && (item.alasan_pending.includes("BLOKIR HARD") || item.alasan_pending.includes("DUPLIKAT"))) {
                infoBlokirHtml = `
                    <div class="alert-box">
                        ⚠️ 🚨 <b>SISTEM MENGUNCI OTOMATIS:</b><br>
                        ${item.alasan_pending}
                    </div>
                `;

                // TOMBOL TANPA PASSWORD/PIN (Hanya konfirmasi teks biasa)
                areaKontrolAksiHtml = `
                    <div class="fraud-action-group">
                        <button class="btn-tolak-keras" onclick="prosesTolakFraudTanpaPin('${item.id_trx}')">
                            🔴 TOLAK FRAUD
                        </button>
                        <button class="btn-cancel-view" onclick="batalkanTampilanKartu(this)">
                            ⚪ CANCEL
                        </button>
                    </div>
                `;
            } else {
                if (item.status === "ANTRIAN_AI") {
                    infoBlokirHtml = `<div class="alert-box-warn">⏳ AI sedang membaca struk di latar belakang... Mohon tunggu 1 menit.</div>`;
                } else {
                    infoBlokirHtml = `<div class="alert-box-warn">💡 Catatan AI: ${item.alasan_pending || 'Butuh Verifikasi Manual.'}</div>`;
                }

                areaKontrolAksiHtml = `
                    <input type="number" class="input-nominal" id="input_koreksi_${item.id_trx}" value="${item.nominal_total}">
                    <button class="btn-action btn-acc" onclick="prosesAccManual('${item.id_trx}', ${item.nominal_total})">
                        ✓ ACC REKAP
                    </button>
                `;
            }

            kontainer.innerHTML += `
                <div class="card" id="card_trx_${item.id_trx}">
                    <div class="nama-santri">${item.nama.toLowerCase()}</div>
                    ${infoBlokirHtml}
                    <a href="${item.link_struk}" target="_blank" class="btn-action btn-struk">🔎 BUKA STRUK ASLI</a>
                    ${areaKontrolAksiHtml}
                </div>
            `;
        });
    }

    function batalkanTampilanKartu(tombol) {
        const cardSasar = tombol.closest('.card');
        if (cardSasar) {
            cardSasar.remove();
            const badge = document.getElementById("badge-count");
            let nilaiSekarang = parseInt(badge.innerText || 0);
            if (nilaiSekarang > 0) badge.innerText = nilaiSekarang - 1;
        }
    }

    function prosesAccManual(idTrx, kodeUnikAnak) {
        const nominalInput = document.getElementById(`input_koreksi_${idTrx}`).value;
        const pin = prompt("Masukkan PIN Keamanan Admin:");
        if (!pin) return;

        eksekusiAksiBackend("luluskanTransaksiOlehAdmin", {
            id_transaksi: idTrx,
            nominal_koreksi: nominalInput,
            kode_unik_anak: kodeUnikAnak,
            pin_admin: pin
        });
    }

    // PROSES TOLAK FRAUD: PIN SUDAH DIHAPUS, GANTI KONFIRMASI LANGSUNG INSTAN
    function prosesTolakFraudTanpaPin(idTrx) {
        const konfirmasi = confirm("Yakin Mas Admin?");
        if (!konfirmasi) return;

        eksekusiAksiBackend("tolakTransaksiOlehAdmin", {
            id_transaksi: idTrx
        });
    }

    function eksekusiAksiBackend(namaAksi, payloadData) {
        payloadData.aksi = namaAksi;
        tampilkanLoading("Sedang memperbarui database server...");

        fetch(URL_GAS_SYSTEM, {
            method: "POST",
            body: JSON.stringify(payloadData)
        })
        .then(r => r.json())
        .then(hasil => {
            alert(hasil.message);
            muatDataAdminSistem();
        })
        .catch(e => {
            alert("Gagal memproses aksi.");
            muatDataAdminSistem();
        });
    }
</script>

</body>
</html>
