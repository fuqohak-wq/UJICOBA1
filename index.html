<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Perizinan Pusat Santri</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">

  <header class="bg-white shadow-sm p-4 mb-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-wide text-indigo-900">E-PERIZINAN PUSAT SANTRI</h1>
        <p class="text-xs text-slate-500">PPMUY - DISIPLIN . LAHIRIAH . KETENANGAN . BATINIAH</p>
      </div>
      <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-3 py-1 rounded-full">PERMIT-CORE ACTIVE</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 lg:col-span-1">
      <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
        📋 FORM PENAJUAN IZIN
      </h2>
      
      <form id="formIzin" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Nomor Induk Komunitas (NIK)</label>
          <input type="text" id="nik" required placeholder="Masukkan NIK Santri..." 
                 class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Jenis Kategori Izin</label>
          <select id="jenis_izin" required 
                  class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">-- Pilih Kategori --</option>
            <option value="Sakit">Sakit (Otomatis ACC)</option>
            <option value="Keluar">Keluar Komplek (Otomatis ACC)</option>
            <option value="Pulang">Pulang ke Rumah (Butuh ACC Wali/Pengasuh)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Alasan / Deskripsi Keperluan</label>
          <textarea id="alasan" required rows="3" placeholder="Tulis rincian alasan secara detail..." 
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Waktu Mulai</label>
            <input type="datetime-local" id="tgl_mulai" required 
                   class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Janji Kembali</label>
            <input type="datetime-local" id="janji_kembali" required 
                   class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <button type="submit" id="btnSubmit" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md shadow-emerald-200 transition duration-200 flex justify-center items-center gap-2">
          🚀 AJUKAN IZIN PERMOHONAN
        </button>
      </form>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 lg:col-span-2 flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
            🖥️ LIVE PERMIT BOARD MONITOR
          </h2>
          <p class="text-xs text-slate-400">Sinkronisasi berkas antrean izin santri secara real-time</p>
        </div>
        <button onclick="ambilLogIzin()" class="border border-slate-200 hover:bg-slate-50 px-3 py-1.5 rounded-xl text-xs font-medium text-slate-600 flex items-center gap-1 transition">
          🔄 REFRESH HUD
        </button>
      </div>

      <div class="overflow-x-auto flex-1">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-200 text-xs font-semibold uppercase text-slate-400 tracking-wider">
              <th class="pb-3 pl-2">Santri</th>
              <th class="pb-3">Kategori & Alasan</th>
              <th class="pb-3">Durasi Waktu</th>
              <th class="pb-3 text-right pr-2">Status Hub</th>
            </tr>
          </thead>
          <tbody id="tabelLog" class="divide-y divide-slate-100 text-sm font-medium">
            <tr>
              <td colspan="4" class="text-center py-8 text-slate-400">Sedang memuat data dari cloud server...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    // MASUKKAN WEB APP URL HASIL DEPLOYMENT GOOGLE APPS SCRIPT KAMU DI SINI!
    const WEB_APP_URL = "https://script.google.com/macros/s/XXXXX_ID_DEPLOYMENT_KAMU_XXXXX/exec";

    // 1. Logika Menangani Kirim Data Form (POST)
    document.getElementById('formIzin').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btnSubmit');
      const textAwal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '⏳ Memproses Berkas...';

      // Menyusun objek payload yang kompatibel 100% dengan doPost pada Apps Script
      const payload = {
        action: "submit_form",
        formData: {
          nik: document.getElementById('nik').value,
          jenis_izin: document.getElementById('jenis_izin').value,
          alasan: document.getElementById('alasan').value,
          tgl_mulai: document.getElementById('tgl_mulai').value,
          janji_kembali: document.getElementById('janji_kembali').value
        }
      };

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors', // Menghindari masalah aturan CORS browser di GitHub Pages
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        // Karena mode 'no-cors' tidak bisa membaca kembalian body JSON secara eksplisit,
        // Kita langsung asumsikan berhasil dikirim jika tidak masuk blok catch.
        alert("Permohonan izin berhasil dikirim ke server pusat!");
        document.getElementById('formIzin').reset();
        setTimeout(ambilLogIzin, 2000); // Refresh tabel otomatis setelah 2 detik

      } catch (error) {
        console.error("Error submit:", error);
        alert("Gagal mengirim data permohonan. Cek koneksi.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = textAwal;
      }
    });

    // 2. Logika Mengambil Data Riwayat Log Izin (GET - aksi=ambil_log_izin)
    async function ambilLogIzin() {
      const tbody = document.getElementById('tabelLog');
      
      try {
        const response = await fetch(`${WEB_APP_URL}?aksi=ambil_log_izin`);
        const result = await response.json();
        
        if (result.status === "success") {
          tbody.innerHTML = ""; // Bersihkan loading text
          
          if (result.data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-400">Belum ada riwayat izin tertulis.</td></tr>`;
            return;
          }

          // Urutkan data terbaru agar tampil di posisi paling atas board (Reverse order)
          result.data.reverse().forEach(row => {
            // Pengaturan warna badge status kustom
            let badgeStyle = "bg-amber-100 text-amber-700";
            if (row.status.includes("Disetujui")) badgeStyle = "bg-emerald-100 text-emerald-700";
            if (row.status.includes("Ditolak")) badgeStyle = "bg-rose-100 text-rose-700";

            tbody.innerHTML += `
              <tr class="hover:bg-slate-50 transition">
                <td class="py-3 pl-2">
                  <div class="font-bold text-slate-700">${row.nama}</div>
                  <div class="text-xs text-slate-400">NIK: ${row.nik} | ${row.kelas}</div>
                </td>
                <td class="py-3">
                  <span class="text-xs font-bold text-indigo-600 block">[ ${row.jenis_izin.toUpperCase()} ]</span>
                  <span class="text-slate-600 text-xs">${row.alasan}</span>
                </td>
                <td class="py-3 text-xs text-slate-500">
                  🛫 ${row.tgl_mulai}<br>🛬 ${row.janji_kembali}
                </td>
                <td class="py-3 text-right pr-2">
                  <span class="px-2.5 py-1 rounded-md text-xs font-bold ${badgeStyle}">${row.status}</span>
                </td>
              </tr>
            `;
          });
        }
      } catch (error) {
        console.error("Error fetch log:", error);
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-rose-500 font-semibold">⚠️ Gagal mensinkronisasikan data dari Cloud.</td></tr>`;
      }
    }

    // Jalankan penarikan data log otomatis saat halaman web pertama kali dibuka
    window.onload = ambilLogIzin;
  </script>
</body>
</html>
