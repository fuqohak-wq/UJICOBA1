<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Tunggakan Santri</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background-color: #f8fafc; color: #334155; padding: 20px; }
    .container { max-w: 1100px; margin: 0 auto; }
    .header-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
    .main-layout { display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 992px) { .main-layout { grid-template-columns: 350px 1fr; } }
    .sidebar-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; height: fit-content; }
    textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; font-size: 13px; font-family: monospace; background-color: #f8fafc; resize: vertical; outline: none; }
    .search-box { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
    .search-box input { width: 100%; border: none; outline: none; font-size: 14px; }
    .table-container { background: white; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background-color: #f1f5f9; padding: 14px 16px; font-size: 12px; font-weight: 600; color: #475569; }
    td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; }
    .minus-amount { font-family: monospace; font-weight: 600; color: #dc2626; text-align: right; }
    .btn-wa { background-color: #16a34a; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; width: 100%; text-align: center; text-decoration: none; display: block;}
    .btn-wa:hover { background-color: #15803d; }
    .loading-text { padding: 40px; text-align: center; color: #64748b; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-card">
      <div>
        <h1 style="font-size: 22px; font-weight:700;">Sistem Monitoring Saldo Minus</h1>
        <p style="font-size: 13px; color: #64748b;">Daftar konfirmasi iuran syahriyyah via Vercel.</p>
      </div>
      <div style="background: #fef9c3; padding: 8px 16px; border-radius: 8px; color: #854d0e; font-size: 13px;" id="counter-info">Memuat data...</div>
    </div>

    <div class="main-layout">
      <div class="sidebar-card">
        <h2 style="font-size: 14px; margin-bottom: 8px;">⚙️ Template Pesan WA</h2>
        <textarea id="template-pesan" rows="10">Assalamualaikum Wr. Wb.
Menginfokan kepada Wali Santri dari {nama}, saldo mengalami minus sebesar {saldo}. Mohon segera melakukan top-up. Terima kasih.</textarea>
      </div>

      <div>
        <div class="search-box">
          <input type="text" id="search-input" oninput="filterSantri()" placeholder="Cari nama santri...">
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th style="width: 50px;">No</th>
                <th>Nama Lengkap</th>
                <th style="text-align: right;">Tunggakan</th>
                <th style="width: 120px; text-align: center;">Aksi</th>
              </tr>
            </thead>
            <tbody id="tabel-santri-body">
              <tr><td colspan="4" class="loading-text">Menghubungkan ke API Google Sheets...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ GANTI DENGAN URL WEB APP /EXEC MILIK ANDA SENDIRI
    const URL_WEB_APP_GAS = "https://script.google.com/macros/s/AKfycbwcRxVXmsKp5Xk-QrWe2E5EaSxfEdC7IAKaiH2wkTiOScfoxOjyU017qsqYzyFUEm-K/exec";

    let masterDataSantri = [];

    window.onload = function() {
      fetch(URL_WEB_APP_GAS)
        .then(response => response.json())
        .then(response => {
          if (response.status === "success") {
            masterDataSantri = response.data;
            renderTabel(masterDataSantri);
          } else {
            alert(response.message);
          }
        })
        .catch(error => alert("Kendala CORS/Koneksi: " + error.toString()));
    };

    function renderTabel(daftarSantri) {
      const tbody = document.getElementById("tabel-santri-body");
      const counterInfo = document.getElementById("counter-info");
      if (daftarSantri.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="loading-text">Tidak ada santri minus.</td></tr>`;
        counterInfo.innerText = "0 Santri";
        return;
      }
      counterInfo.innerText = `${daftarSantri.length} Santri Minus`;
      tbody.innerHTML = "";
      daftarSantri.forEach((santri, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td style="text-align:center; color:#94a3b8;">${index + 1}</td>
          <td><strong>${santri.nama}</strong><br><small style="color:#94a3b8;">${santri.whatsapp}</small></td>
          <td class="minus-amount">-${santri.tunggakanTerformat}</td>
          <td><button class="btn-wa" onclick="kirimWhatsApp('${santri.nama.replace(/'/g, "\\'")}', '${santri.whatsapp}', '${santri.tunggakanTerformat}')">Kirim WA</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterSantri() {
      const kataKunci = document.getElementById("search-input").value.toLowerCase().trim();
      const hasilFilter = masterDataSantri.filter(s => s.nama.toLowerCase().includes(kataKunci));
      renderTabel(hasilFilter);
    }

    function kirimWhatsApp(nama, noHp, nominal) {
      if (!noHp) return alert("Nomor kosong");
      let bersih = noHp.replace(/\D/g, '');
      if (bersih.startsWith('0')) bersih = '62' + bersih.slice(1);
      let text = document.getElementById("template-pesan").value.replace(/{nama}/g, nama).replace(/{saldo}/g, nominal);
      window.open(`https://api.whatsapp.com/send?phone=${bersih}&text=${encodeURIComponent(text)}`, '_blank');
    }
  </script>
</body>
</html>
