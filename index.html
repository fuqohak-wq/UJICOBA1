<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yayasan Yahyawiyyah V2.5 - Panel Kendali</title>
    <style>
        body {
            background-color: #051d14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 550px;
            background-color: #03140e;
            padding: 20px;
            border-radius: 12px;
            border-top: 4px solid #f39c12;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .header {
            margin-bottom: 25px;
        }
        .header h5 {
            color: #f39c12;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
        }
        .header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .panel-title {
            background-color: #08291d;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 15px;
        }
        .logout-btn {
            color: #ff7675;
            text-decoration: none;
            font-size: 14px;
        }
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .tab-pending {
            background-color: #096343;
            color: white;
        }
        .tab-badge {
            background-color: #ff3333;
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 11px;
            margin-left: 3px;
        }
        .tab-riwayat {
            background-color: #112a20;
            color: #a4b0be;
        }
        .card {
            background-color: #0a1f18;
            border: 1px solid #123327;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
        }
        .card .nama-santri {
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 8px 0;
            color: #ffffff;
        }
        .alert-box {
            background-color: rgba(255, 51, 51, 0.1);
            border: 1px dashed #ff3333;
            color: #ff7675;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.4;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .alert-box-warn {
            background-color: rgba(243, 156, 18, 0.1);
            border: 1px dashed #f39c12;
            color: #f39c12;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .btn-action {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
            text-decoration: none;
            margin-bottom: 10px;
        }
        .btn-struk {
            background-color: #04120e;
            color: #3498db;
            border: 1px solid #1d332c;
        }
        .input-nominal {
            width: 100%;
            padding: 12px;
            background-color: #04120e;
            border: 1px solid #163a2c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            border-radius: 6px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .btn-acc {
            background-color: #096343;
            color: white;
        }
        .btn-acc:hover { background-color: #0b754f; }
        .btn-tolak-keras {
            background-color: #b33939;
            color: white;
        }
        .btn-tolak-keras:hover { background-color: #ff5252; }
        .loading {
            text-align: center;
            color: #f39c12;
            font-weight: bold;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h5>YAYASAN YAHYAWIYYAH V2.5</h5>
        <h2>IKHTIYAR KHIDMAH TERBAIK UNTUK UMMAH</h2>
    </div>

    <div class="panel-title">
        <span>🎛️ PANEL KENDALI V2.5</span>
        <a href="#" class="logout-btn">Keluar</a>
    </div>

    <div class="tabs">
        <button class="tab-btn tab-pending" id="btn-tab-pending">
            📥 Antrean Pending <span class="tab-badge" id="badge-count">0</span>
        </button>
        <button class="tab-btn tab-riwayat" id="btn-tab-riwayat" onclick="alert('Fitur Log Riwayat Standar Aktif')">
            📊 Log Riwayat
        </button>
    </div>

    <!-- AREA DINAMIS TEMPAT DAFTAR ANTREAN DI-RENDER -->
    <div id="loading-status" class="loading">Menghubungkan ke Google Sheets...</div>
    <div id="area-antrean-list"></div>
</div>

<script>
    // URL Web App GAS Bapak (Ganti dengan URL eksekusi milik Bapak jika diperlukan)
    const URL_GAS_SYSTEM = "https://script.google.com/macros/s/AKfycbwqZ-KbyqVq8A6uR8X07C3hHsh77kIeNfC4v_RREtHw7F22G7I5oT5v7fM2o4Rz_o4P/exec"; 

    // Load Data Otomatis saat halaman dibuka
    document.addEventListener("DOMContentLoaded", muatDataAdminSistem);

    function muatDataAdminSistem() {
        document.getElementById("loading-status").style.display = "block";
        document.getElementById("area-antrean-list").innerHTML = "";

        fetch(`${URL_GAS_SYSTEM}?aksi=ambilDataAdminLengkap`)
        .then(response => response.json())
        .then(res => {
            document.getElementById("loading-status").style.display = "none";
            if(res.status === "success") {
                document.getElementById("badge-count").innerText = res.antrean.length;
                renderAntreanKeLayar(res.antrean);
            } else {
                document.getElementById("area-antrean-list").innerHTML = `<p style="color:red">Gagal ambil data: ${res.message}</p>`;
            }
        })
        .catch(err => {
            document.getElementById("loading-status").style.display = "none";
            document.getElementById("area-antrean-list").innerHTML = `<p style="color:red">Eror Jaringan Server: ${err.toString()}</p>`;
        });
    }

    function renderAntreanKeLayar(daftarAntrean) {
        const kontainer = document.getElementById("area-antrean-list");
        if (daftarAntrean.length === 0) {
            kontainer.innerHTML = `<p style="text-align:center; color:#a4b0be; padding:20px;">🎉 Semua antrean bersih! Tidak ada transaksi pending.</p>`;
            return;
        }

        daftarAntrean.forEach(item => {
            let infoBlokirHtml = "";
            let areaKontrolAksiHtml = "";

            // -------------------------------------------------------------
            // ENGINE ANTI HUMAN ERROR - DETEKSI FLAG "BLOKIR HARD" DARI GAS V3.9
            // -------------------------------------------------------------
            if (item.alasan_pending && item.alasan_pending.includes("BLOKIR HARD")) {
                
                // 1. Desain Box Alert Bahaya (Merah Menyala)
                infoBlokirHtml = `
                    <div class="alert-box">
                        ⚠️ 🚨 ${item.alasan_pending}
                    </div>
                `;

                // 2. Kunci Total Tombol ACC, Ganti Paksa Jadi Tombol Tolak Fraud
                areaKontrolAksiHtml = `
                    <button class="btn-action btn-tolak-keras" onclick="prosesTolakFraud('${item.id_trx}')">
                        🔴 TOLAK & HAPUS DATA FRAUD
                    </button>
                `;

            } else {
                // KONDISI NORMAL (Jika transaksi aman atau hanya butuh 1x konfirmasi nominal)
                if (item.status === "ANTRIAN_AI") {
                    infoBlokirHtml = `<div class="alert-box-warn">⏳ AI sedang membaca struk di latar belakang... Mohon tunggu 1 menit.</div>`;
                } else {
                    infoBlokirHtml = `<div class="alert-box-warn">💡 Catatan AI: ${item.alasan_pending || 'Butuh Verifikasi Manual.'}</div>`;
                }

                areaKontrolAksiHtml = `
                    <input type="number" class="input-nominal" id="input_koreksi_${item.id_trx}" value="${item.nominal_total}" placeholder="Ketik nominal...">
                    <button class="btn-action btn-acc" onclick="prosesAccManual('${item.id_trx}', ${item.nominal_total})">
                        ✓ ACC REKAP
                    </button>
                `;
            }

            // Gabungkan Komponen ke dalam Card Tampilan sesuai layout asli Bapak
            const HTML_CARD = `
                <div class="card">
                    <div class="nama-santri">${item.nama.toLowerCase()}</div>
                    ${infoBlokirHtml}
                    
                    <a href="${item.link_struk}" target="_blank" class="btn-action btn-struk">
                        🔎 BUKA STRUK ASLI
                    </a>
                    
                    ${areaKontrolAksiHtml}
                </div>
            `;
            kontainer.innerHTML += HTML_CARD;
        });
    }

    // Fungsi Aksi 1: ACC Transaksi Normal
    function prosesAccManual(idTrx, kodeUnikAnak) {
        const nominalInput = document.getElementById(`input_koreksi_${idTrx}`).value;
        const pin = prompt("Masukkan PIN Keamanan Admin:");
        if (!pin) return;

        eksekusiAksiBackend("luluskanTransaksiOlehAdmin", {
            id_transaksi: idTrx,
            nominal_koreksi: nominalInput,
            kode_unik_anak: kodeUnikAnak,
            pin_admin: pin
        });
    }

    // Fungsi Aksi 2: Tolak Mutlak Transaksi Penipuan/Iseng (Anti-Human Error)
    function prosesTolakFraud(idTrx) {
        const konfirmasi = confirm("Sistem mendeteksi ini struk palsu/kembar milik orang lain. Anda yakin ingin MENOLAK dan MEMBLOKIR transaksi ini?");
        if (!konfirmasi) return;

        const pin = prompt("PERINGATAN TINGGI! Masukkan PIN Admin untuk membuang kecurangan:");
        if (!pin) return;

        eksekusiAksiBackend("tolakTransaksiOlehAdmin", {
            id_transaksi: idTrx,
            pin_admin: pin
        });
    }

    // Core Engine Bridge ke Google Apps Script
    function eksekusiAksiBackend(namaAksi, payloadData) {
        payloadData.aksi = namaAksi;
        
        document.getElementById("loading-status").style.display = "block";
        document.getElementById("loading-status").innerText = "Mengirim keputusan ke server...";

        fetch(URL_GAS_SYSTEM, {
            method: "POST",
            body: JSON.stringify(payloadData)
        })
        .then(r => r.json())
        .then(hasil => {
            alert(hasil.message);
            muatDataAdminSistem(); // Refresh data otomatis
        })
        .catch(e => {
            alert("Gagal memproses aksi: " + e.toString());
            muatDataAdminSistem();
        });
    }
</script>

</body>
</html>
