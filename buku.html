<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Profesional</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <style>
        :root {
            --bg-body: #1a1a1a;
            --panel-bg: #2a2a2a;
            --accent-gold: #c5a059;
            --paper-bg: #fbf7ee;
            --paper-text: #2c2523;
            --paper-border: #e2d9c8;
            --ornament-color: #4a3b32;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-body);
            color: #fff;
            min-height: 100vh;
        }

        /* Control Panel Header UI */
        .control-panel {
            background-color: var(--panel-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-gold);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .btn-group { display: flex; gap: 10px; align-items: center; }

        .btn-upload {
            background: linear-gradient(135deg, #c5a059, #9e7d3b);
            color: #fff;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-action {
            background: #3a3a3a;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-action:hover { border-color: var(--accent-gold); }

        input[type="file"] { display: none; }

        /* Workspace & Canvas Buku */
        .workspace {
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            background: #111;
        }

        .book-page {
            width: 148mm;
            min-height: 210mm;
            background-color: var(--paper-bg);
            color: var(--paper-text);
            padding: 20mm 15mm 20mm 15mm;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid var(--paper-border);
            position: relative;
        }

        /* Tipografi & Paragraf */
        .book-content p {
            font-family: 'Merriweather', serif;
            font-size: 9.5pt;
            line-height: 1.85;
            text-align: justify;
            text-indent: 1.5em;
            margin-bottom: 10px;
        }

        /* Header Bab & Ornamen Lengkung */
        .chapter-header {
            text-align: center;
            margin: 35px 0 25px 0;
            page-break-before: always;
        }

        .chapter-header:first-child { page-break-before: avoid; }

        .chapter-ornament-svg {
            width: 100px;
            height: 30px;
            margin: 0 auto 10px auto;
            fill: var(--ornament-color);
            display: block;
        }

        .chapter-number {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--paper-text);
        }

        .chapter-title {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 8px;
        }

        /* Drop Cap di Awal Bab */
        .chapter-header + p::first-letter {
            font-family: 'Cinzel', serif;
            font-size: 3.2em;
            float: left;
            line-height: 0.8;
            padding-right: 8px;
            padding-top: 2px;
            color: var(--ornament-color);
            font-weight: bold;
        }

        /* Formatting Angka Rujukan Footnote [1], [2] di dalam Teks */
        .book-content sup, .book-content a[href*="#fn"], .book-content a[id*="fnref"] {
            font-family: 'Merriweather', serif;
            font-size: 0.75em;
            vertical-align: super;
            color: var(--ornament-color);
            text-decoration: none;
            font-weight: bold;
            padding: 0 2px;
        }

        /* Formatting Area Footnote / Catatan Kaki Bawah */
        .book-content ol[id*="fn"], .book-content .footnotes, .footnotes-list {
            margin-top: 30px;
            padding-top: 12px;
            border-top: 1px solid var(--ornament-color);
            font-size: 8pt;
            line-height: 1.6;
        }

        .book-content ol[id*="fn"] li, .footnotes-list li {
            font-family: 'Merriweather', serif;
            margin-bottom: 6px;
            text-align: justify;
            color: #333;
        }

        /* Sembunyikan Panah Kembalian (↑) dari Mammoth */
        .book-content a[href*="#fnref"], .book-content .footnote-backlink {
            display: none !important;
        }

        /* Formatting Daftar Pustaka / Bibliography (Hanging Indent) */
        .bibliography-section p, .daftar-pustaka p {
            text-indent: -2em !important;
            padding-left: 2em !important;
            margin-bottom: 8px !important;
            text-align: left !important;
        }

        /* Scene Break / Pembatas Elegan */
        .scene-break {
            text-align: center;
            margin: 20px 0;
            font-size: 1.2rem;
            color: var(--ornament-color);
        }

        /* Footer & Nomor Halaman */
        .page-footer {
            margin-top: 40px;
            text-align: center;
        }

        .page-number {
            display: inline-block;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: bold;
            padding: 2px 12px;
        }

        /* ==========================================================================
           PENGATURAN CETAK / PDF BERSIH KELAS BUKU CETAK (BEBAS TEXT BROWSER)
           ========================================================================== */
        @media print {
            /* Sembunyikan Navigasi Web */
            .control-panel { display: none !important; }
            
            body { 
                background: white !important; 
                color: black !important;
            }
            
            .workspace { 
                padding: 0 !important; 
                background: transparent !important; 
                display: block !important; 
            }
            
            .book-page {
                width: 100% !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            /* MENGHILANGKAN HEADER/FOOTER BROWSERS (URL, TANGGAL, JUDUL) BERSIH 100% */
            @page {
                size: A5;
                margin: 15mm 12mm 15mm 12mm;
            }
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <div class="logo">✨ PUBLISHER BOOK ENGINE</div>
        <div class="btn-group">
            <label class="btn-upload">
                📂 Upload DOCX
                <input type="file" id="docxInput" accept=".docx">
            </label>
            <button class="btn-action" onclick="downloadPDF()">🖨️ Simpan ke PDF Bersih</button>
            <button class="btn-action" onclick="exportWord()">📝 Download Word</button>
        </div>
    </div>

    <div class="workspace">
        <div class="book-page" id="bookRenderArea">
            <div class="book-content" id="bookContent">
                <div class="chapter-header">
                    <svg class="chapter-ornament-svg" viewBox="0 0 200 40">
                        <path d="M20,20 Q100,0 180,20 Q100,40 20,20 Z" />
                    </svg>
                    <div class="chapter-number">1</div>
                    <div class="chapter-title">Pratinjau Layout</div>
                </div>
                <p>Silakan unggah dokumen Word (.docx) Anda. Sistem akan langsung mengurutkan catatan kaki (footnote), menghapus simbol tautan aneh, serta memberikan format daftar pustaka profesional secara otomatis.</p>
            </div>
            <div class="page-footer">
                <div class="page-number">1</div>
            </div>
        </div>
    </div>

    <script>
        let filename = "Buku_Profesional";

        document.getElementById('docxInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            filename = file.name.replace('.docx', '');

            const reader = new FileReader();
            reader.onload = function(event) {
                // Konversi Mammoth dengan penanganan Footnote
                mammoth.convertToHtml({arrayBuffer: event.target.result})
                    .then(processAndCleanHtml)
                    .catch(err => alert("Error membaca file: " + err.message));
            };
            reader.readAsArrayBuffer(file);
        });

        function processAndCleanHtml(result) {
            let rawHtml = result.value;
            let parser = new DOMParser();
            let doc = parser.parseFromString(rawHtml, 'text/html');

            let formattedHtml = "";
            let chapIndex = 1;
            let isBiblioSection = false;

            let elements = doc.body.children;

            for (let i = 0; i < elements.length; i++) {
                let el = elements[i];
                let textContent = el.innerText.trim();

                // Deteksi Judul Bab (H1 / H2)
                if (el.tagName === 'H1' || el.tagName === 'H2') {
                    if (textContent.toUpperCase().includes("DAFTAR PUSTAKA") || textContent.toUpperCase().includes("BIBLIOGRAFI")) {
                        isBiblioSection = true;
                    }

                    formattedHtml += `
                        <div class="chapter-header">
                            <svg class="chapter-ornament-svg" viewBox="0 0 200 40">
                                <path d="M20,20 Q100,0 180,20 Q100,40 20,20 Z" />
                            </svg>
                            <div class="chapter-title">${el.innerText}</div>
                        </div>
                    `;
                } 
                // Deteksi Pembatas Halaman/Bagian
                else if (textContent === '***' || textContent === '---') {
                    formattedHtml += `<div class="scene-break">❖ ❖ ❖</div>`;
                }
                // Deteksi Paragraf / Daftar Pustaka
                else if (el.tagName === 'P') {
                    if (textContent !== '') {
                        if (isBiblioSection) {
                            formattedHtml += `<div class="bibliography-section"><p>${el.innerHTML}</p></div>`;
                        } else {
                            formattedHtml += `<p>${el.innerHTML}</p>`;
                        }
                    }
                } 
                // Komponen lainnya (Tabel, Ol, Ul)
                else {
                    formattedHtml += el.outerHTML;
                }
            }

            // Bersihkan simbol panah ↑ dan format footnote
            document.getElementById('bookContent').innerHTML = formattedHtml;
        }

        function downloadPDF() {
            window.print();
        }

        function exportWord() {
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'></head><body>";
            const footer = "</body></html>";
            const sourceHTML = header + document.getElementById("bookRenderArea").innerHTML + footer;
            
            const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            const fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;
            fileDownload.download = `${filename}_Formatted.doc`;
            fileDownload.click();
            document.body.removeChild(fileDownload);
        }
    </script>
</body>
</html>
