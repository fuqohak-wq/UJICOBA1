<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegan Book Layout Engine - Fixed</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
    
    <!-- Mammoth.js untuk baca DOCX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <style>
        /* ==========================================
           1. PANEL KONTROL (UI ATAS)
           ========================================== */
        :root {
            --bg-body: #1a1a1a;
            --panel-bg: #2a2a2a;
            --accent-gold: #c5a059;
            --paper-bg: #fbf7ee;
            --paper-text: #2c2523;
            --paper-border: #e2d9c8;
            --ornament-color: #4a3b32;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-body);
            color: #fff;
            min-height: 100vh;
        }

        .control-panel {
            background-color: var(--panel-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-gold);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 1.2rem;
            font-weight: 700;
        }

        .btn-group { display: flex; gap: 10px; align-items: center; }

        .btn-upload {
            background: linear-gradient(135deg, #c5a059, #9e7d3b);
            color: #fff;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-action {
            background: #3a3a3a;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-action:hover { border-color: var(--accent-gold); }

        input[type="file"] { display: none; }

        /* ==========================================
           2. TAMPILAN BUKU (PREVIEW DI WEB)
           ========================================== */
        .workspace {
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            background: #111;
        }

        .book-page {
            width: 148mm; /* Ukuran Standar Buku A5 */
            min-height: 210mm;
            background-color: var(--paper-bg);
            color: var(--paper-text);
            padding: 20mm 15mm 20mm 15mm;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid var(--paper-border);
            margin-bottom: 30px;
            position: relative;
        }

        /* Running Header Buku */
        .running-header {
            text-align: center;
            font-family: 'Pinyon Script', cursive;
            font-size: 1.3rem;
            color: var(--ornament-color);
            border-bottom: 1px dashed var(--paper-border);
            padding-bottom: 5px;
            margin-bottom: 25px;
        }

        /* Bab & Ornaments */
        .chapter-header {
            text-align: center;
            margin: 30px 0 25px 0;
        }

        .chapter-ornament-svg {
            width: 120px;
            height: 40px;
            margin: 0 auto 10px auto;
            fill: var(--ornament-color);
            display: block;
        }

        .chapter-number {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--paper-text);
        }

        .chapter-title {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* Paragraf & Tipografi */
        .book-content p {
            font-family: 'Merriweather', serif;
            font-size: 10pt;
            line-height: 1.8;
            text-align: justify;
            text-indent: 1.5em;
            margin-bottom: 12px;
        }

        /* Drop Cap di Awal Bab */
        .chapter-header + p::first-letter,
        .drop-cap::first-letter {
            font-family: 'Cinzel', serif;
            font-size: 3em;
            float: left;
            line-height: 0.8;
            padding-right: 8px;
            padding-top: 4px;
            color: var(--ornament-color);
            font-weight: bold;
        }

        /* ==========================================
           3. PERBAIKAN FORMAT TABEL (SANGAT RAPI)
           ========================================== */
        .book-content table {
            width: 100% !important;
            border-collapse: collapse !important;
            margin: 20px 0 !important;
            font-family: 'Merriweather', serif;
            font-size: 9pt;
            background-color: rgba(255, 255, 255, 0.4);
        }

        .book-content th, .book-content td {
            border: 1px solid var(--ornament-color) !important;
            padding: 8px 12px !important;
            text-align: left !important;
            vertical-align: top !important;
            line-height: 1.5 !important;
        }

        .book-content th {
            background-color: rgba(197, 160, 89, 0.2) !important;
            font-family: 'Cinzel', serif !important;
            font-weight: bold !important;
        }

        .book-content tr:nth-child(even) {
            background-color: rgba(0, 0, 0, 0.02);
        }

        /* Scene Break / Pembatas */
        .scene-break {
            text-align: center;
            margin: 20px 0;
            font-size: 1.1rem;
            color: var(--ornament-color);
            letter-spacing: 4px;
        }

        /* Footer & Nomor Halaman */
        .page-footer {
            margin-top: 40px;
            text-align: center;
        }

        .page-number {
            display: inline-block;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            border-top: 1px solid var(--ornament-color);
            border-bottom: 1px solid var(--ornament-color);
            padding: 2px 15px;
        }

        /* ==========================================
           4. CETAK & SIMPAN PDF (WINDOW.PRINT)
           ========================================== */
        @media print {
            .control-panel { display: none !important; }
            body { background: white !important; color: black !important; }
            .workspace { padding: 0 !important; background: transparent !important; display: block !important; }
            .book-page {
                width: 100% !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                page-break-after: always;
            }
            @page {
                size: A5;
                margin: 18mm 12mm 18mm 12mm;
            }
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <div class="logo">✨ LAYOUT BUKU PROFESIONAL</div>
        <div class="btn-group">
            <label class="btn-upload">
                📂 Upload DOCX
                <input type="file" id="docxInput" accept=".docx">
            </label>
            <button class="btn-action" onclick="downloadPDF()">🖨️ Cetak / Simpan PDF</button>
            <button class="btn-action" onclick="exportWord()">📝 Download Word</button>
        </div>
    </div>

    <div class="workspace">
        <div class="book-page" id="bookRenderArea">
            <div class="running-header">C'est La Vie !</div>
            <div class="book-content" id="bookContent">
                <div class="chapter-header">
                    <svg class="chapter-ornament-svg" viewBox="0 0 200 60">
                        <path d="M100 10 C60 10, 40 40, 10 30 C40 35, 60 20, 100 25 C140 20, 160 35, 190 30 C160 40, 140 10, 100 10 Z" />
                    </svg>
                    <div class="chapter-number">1</div>
                    <div class="chapter-title">Sains & Filosofi</div>
                </div>
                <p>Silakan upload file .docx Anda menggunakan tombol di atas. Tabel, paragraf, dan bab akan otomatis ditata secara sangat rapi dan presisi khas buku novel/karya ilmiah cetak.</p>
            </div>
            <div class="page-footer">
                <div class="page-number">1</div>
            </div>
        </div>
    </div>

    <script>
        let filename = "Buku_Hasil_Layout";

        document.getElementById('docxInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            filename = file.name.replace('.docx', '');

            const reader = new FileReader();
            reader.onload = function(event) {
                mammoth.convertToHtml({arrayBuffer: event.target.result})
                    .then(processHtml)
                    .catch(err => alert("Gagal membaca file: " + err.message));
            };
            reader.readAsArrayBuffer(file);
        });

        function processHtml(result) {
            let rawHtml = result.value;
            let parser = new DOMParser();
            let doc = parser.parseFromString(rawHtml, 'text/html');

            let formattedHtml = "";
            let chapIndex = 1;
            let elements = doc.body.children;

            for (let i = 0; i < elements.length; i++) {
                let el = elements[i];

                // Jika Judul Bab (H1 / H2)
                if (el.tagName === 'H1' || el.tagName === 'H2') {
                    formattedHtml += `
                        <div class="chapter-header">
                            <svg class="chapter-ornament-svg" viewBox="0 0 200 60">
                                <path d="M100 10 C60 10, 40 40, 10 30 C40 35, 60 20, 100 25 C140 20, 160 35, 190 30 C160 40, 140 10, 100 10 Z" />
                            </svg>
                            <div class="chapter-number">${chapIndex++}</div>
                            <div class="chapter-title">${el.innerText}</div>
                        </div>
                    `;
                } 
                // Jika Pembatas Scene
                else if (el.innerText.trim() === '***' || el.innerText.trim() === '---') {
                    formattedHtml += `<div class="scene-break">❖ ❖ ❖</div>`;
                } 
                // Jika Tabel
                else if (el.tagName === 'TABLE') {
                    formattedHtml += el.outerHTML; // Otomatis dirapikan oleh CSS khusus tabel kita
                }
                // Jika Paragraf
                else if (el.tagName === 'P') {
                    if (el.innerText.trim() !== '') {
                        formattedHtml += `<p>${el.innerHTML}</p>`;
                    }
                } else {
                    formattedHtml += el.outerHTML;
                }
            }

            document.getElementById('bookContent').innerHTML = formattedHtml;
        }

        // Fungsi PDF Aman & Anti-Crash (Menggunakan Print Dialog Native Browser)
        function downloadPDF() {
            window.print();
        }

        // Fungsi Download Word
        function exportWord() {
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'></head><body>";
            const footer = "</body></html>";
            const sourceHTML = header + document.getElementById("bookRenderArea").innerHTML + footer;
            
            const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            const fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;
            fileDownload.download = `${filename}_Layout.doc`;
            fileDownload.click();
            document.body.removeChild(fileDownload);
        }
    </script>
</body>
</html>
