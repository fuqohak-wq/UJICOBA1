<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Profesional Engine</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    
    <!-- Mammoth.js untuk membaca DOCX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <style>
        /* ==========================================
           1. LAYOUT & UI UTAMA (KONTRASTING PREVIEW)
           ========================================== */
        :root {
            --font-title: 'Cinzel', serif;
            --font-body: 'Merriweather', serif;
            --paper-bg: #fdfbf7; /* Warna Kertas Cream Mewah */
            --paper-text: #1a1a1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background-color: #121212;
            color: #fff;
            min-height: 100vh;
        }

        /* Top Bar Control Panel */
        .control-panel {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: #1e1e1e;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10000;
            border-bottom: 2px solid #c5a059;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .brand-title {
            color: #c5a059;
            font-family: var(--font-title);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .btn-upload {
            background: #c5a059;
            color: #000;
            padding: 8px 18px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-upload:hover { background: #d4af66; }

        .btn-action {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 8px;
        }

        .btn-action:hover { border-color: #c5a059; }

        input[type="file"] { display: none; }

        /* Workspace Area Tempat Lembaran Buku Muncul */
        .workspace {
            margin-top: 70px;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            background-color: #1a1a1a;
            min-height: calc(100vh - 70px);
        }

        /* Container Kertas Buku (A5 Format) */
        .book-container {
            width: 148mm;
            min-height: 210mm;
            background-color: var(--paper-bg);
            color: var(--paper-text);
            padding: 20mm 15mm 20mm 15mm;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            border: 1px solid #dcd4c5;
            box-sizing: border-box;
        }

        /* ==========================================
           2. FORMAT ISI BUKU PROFESIONAL
           ========================================== */

        /* Judul Awal & Judul Bab Seimbang */
        .book-title-header {
            text-align: center;
            margin: 30px 0 25px 0;
            page-break-before: always;
        }

        .book-title-header:first-child { page-break-before: avoid; }

        .book-title-header h1 {
            font-family: var(--font-title);
            font-size: 1.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #111;
            margin-bottom: 8px;
        }

        /* Paragraf Teks Murni (Bebas Warna Biru & Font Seragam) */
        p {
            font-family: var(--font-body) !important;
            font-size: 9.5pt !important;
            line-height: 1.8 !important;
            text-align: justify !important;
            text-indent: 1.5em;
            margin-bottom: 10px;
            color: #1a1a1a !important;
        }

        /* Sembunyikan Link Biru Netral */
        a {
            color: inherit !important;
            text-decoration: none !important;
        }

        /* Daftar Isi Rapi Tanpa Warna Biru */
        .toc-entry {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-family: var(--font-body);
            font-size: 9.5pt;
            margin-bottom: 8px;
            color: #111;
        }

        .toc-dots {
            flex: 1;
            border-bottom: 1px dotted #777;
            margin: 0 8px;
        }

        /* Format Tabel Elegan - Header Hitam Tipis Minimalis */
        table {
            width: 100% !important;
            border-collapse: collapse !important;
            margin: 20px 0 !important;
            font-size: 8.5pt !important;
            font-family: var(--font-body) !important;
            background: #ffffff;
        }

        th {
            background-color: #222222 !important;
            color: #ffffff !important;
            font-family: var(--font-title) !important;
            font-weight: 600 !important;
            text-align: left !important;
            padding: 8px 10px !important;
            border: 1px solid #222 !important;
        }

        td {
            border: 1px solid #cccccc !important;
            padding: 8px 10px !important;
            vertical-align: top !important;
            color: #222 !important;
        }

        tr:nth-child(even) td {
            background-color: #f7f5f0;
        }

        /* Format Catatan Kaki (Footnote) Bawah Halaman */
        .footnote-area {
            margin-top: 30px;
            padding-top: 10px;
            border-top: 1px solid #444;
            font-size: 8pt;
            line-height: 1.6;
        }

        .footnote-area ol {
            padding-left: 18px;
        }

        .footnote-area li {
            margin-bottom: 4px;
            text-align: justify;
            color: #333;
        }

        /* Angka Footnote di dalam Teks */
        sup {
            font-size: 0.7em;
            vertical-align: super;
            font-weight: bold;
            padding: 0 1px;
        }

        /* ==========================================
           3. CETAK / SAVE PDF BERSIH
           ========================================== */
        @media print {
            .control-panel { display: none !important; }
            body { background: white !important; }
            .workspace { padding: 0 !important; background: transparent !important; }
            .book-container {
                width: 100% !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
            }
            @page {
                size: A5;
                margin: 20mm 15mm 20mm 15mm;
            }
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <div class="brand-title">✨ BUKU PROFESIONAL ENGINE</div>
        <div>
            <label class="btn-upload">
                📂 Upload DOCX
                <input type="file" id="docxInput" accept=".docx">
            </label>
            <button class="btn-action" onclick="window.print()">🖨️ Simpan PDF</button>
        </div>
    </div>

    <div class="workspace">
        <div class="book-container" id="bookRenderArea">
            <div class="book-title-header">
                <h1>Pratinjau Layout Buku</h1>
            </div>
            <p>Silakan upload file .docx Anda menggunakan tombol di atas. Sistem akan menyusun isi buku menjadi format cetak A5 yang rapi, terang, dan nyaman dibaca.</p>
        </div>
    </div>

    <script>
        document.getElementById('docxInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                mammoth.convertToHtml({arrayBuffer: event.target.result})
                    .then(formatDocument)
                    .catch(err => alert("Gagal membaca file: " + err.message));
            };
            reader.readAsArrayBuffer(file);
        });

        function formatDocument(result) {
            let rawHtml = result.value;
            let parser = new DOMParser();
            let doc = parser.parseFromString(rawHtml, 'text/html');

            let output = document.createElement('div');
            let elements = doc.body.children;
            let inToc = false;

            for (let i = 0; i < elements.length; i++) {
                let el = elements[i];
                let text = el.innerText.trim();

                // 1. Judul Bab & Cover
                if (el.tagName === 'H1' || el.tagName === 'H2') {
                    if (text.toUpperCase().includes("DAFTAR ISI")) {
                        inToc = true;
                        output.innerHTML += `<div class="book-title-header"><h1>DAFTAR ISI</h1></div>`;
                        continue;
                    }
                    inToc = false;
                    output.innerHTML += `<div class="book-title-header"><h1>${text}</h1></div>`;
                }
                // 2. Format Daftar Isi
                else if (inToc && el.tagName === 'P') {
                    if (text !== '') {
                        let pageMatch = text.match(/(.*?)\s*(\d+)$/);
                        if (pageMatch) {
                            output.innerHTML += `<div class="toc-entry"><span>${pageMatch[1]}</span><span class="toc-dots"></span><span>${pageMatch[2]}</span></div>`;
                        } else {
                            output.innerHTML += `<div class="toc-entry"><span>${text}</span></div>`;
                        }
                    }
                }
                // 3. Format Tabel Header Hitam Tipis
                else if (el.tagName === 'TABLE') {
                    inToc = false;
                    let table = el.cloneNode(true);
                    let firstRow = table.querySelector('tr');
                    if (firstRow) {
                        let cells = firstRow.querySelectorAll('td, th');
                        cells.forEach(cell => {
                            let th = document.createElement('th');
                            th.innerHTML = cell.innerHTML;
                            cell.replaceWith(th);
                        });
                    }
                    output.appendChild(table);
                }
                // 4. Paragraf Biasa
                else if (el.tagName === 'P') {
                    inToc = false;
                    if (text !== '') {
                        output.innerHTML += `<p>${el.innerHTML}</p>`;
                    }
                }
                // 5. Footnote Area
                else if (el.tagName === 'OL' || el.classList.contains('footnotes')) {
                    output.innerHTML += `<div class="footnote-area">${el.outerHTML}</div>`;
                }
                else {
                    output.appendChild(el.cloneNode(true));
                }
            }

            document.getElementById('bookRenderArea').innerHTML = output.innerHTML;
        }
    </script>
</body>
</html>
