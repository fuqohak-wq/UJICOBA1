<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Profesional Engine</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    
    <!-- Mammoth.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    
    <!-- Paged.js Engine (Membuat Layout Buku & Footnote Bottom-Page Otomatis) -->
    <script src="https://unpkg.com/pagedjs/dist/paged.polyline.js"></script>

    <style>
        /* ==========================================================================
           1. LAYOUT & TIPOGRAFI BUKU PROFESIONAL (KONSISTEN 100%)
           ========================================================================== */
        :root {
            --font-title: 'Cinzel', serif;
            --font-body: 'Merriweather', serif;
            --text-color: #111111;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            color: var(--text-color);
            background: #222;
        }

        /* Control Panel Top UI */
        .control-panel {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: #1a1a1a;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 99999;
            border-bottom: 2px solid #c5a059;
        }

        .btn-upload {
            background: #c5a059;
            color: #000;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-action {
            background: #333;
            color: #fff;
            border: 1px solid #666;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="file"] { display: none; }

        /* Area Render Halaman Buku */
        #render-output {
            margin-top: 60px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ==========================================================================
           2. FORMAT ELEMEN DOKUMEN (JUDUL, DAFTAR ISI, TABEL, FOOTNOTE)
           ========================================================================== */
        
        /* Judul Awal / H1 / Cover Title */
        .book-title-header {
            text-align: center;
            margin: 40px 0 30px 0;
            page-break-before: always;
        }

        .book-title-header h1 {
            font-family: var(--font-title);
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #000;
        }

        .book-title-header .author-name {
            font-family: var(--font-body);
            font-size: 1rem;
            font-style: italic;
            margin-top: 15px;
            text-align: center;
        }

        /* Paragraf & Tipografi Bersih (Teks Hitam Netral, Bebas Warna Biru) */
        p {
            font-family: var(--font-body) !important;
            font-size: 9.5pt !important;
            line-height: 1.8 !important;
            text-align: justify !important;
            text-indent: 1.5em;
            margin-bottom: 8px;
            color: #111 !important;
        }

        /* Hilangkan warna biru link pada teks biasa */
        a {
            color: inherit !important;
            text-decoration: none !important;
        }

        /* Format Daftar Isi Rapi (Dot Leaders & No Blue Text) */
        .toc-container {
            margin: 30px 0;
            page-break-after: always;
        }

        .toc-entry {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-family: var(--font-body);
            font-size: 9.5pt;
            margin-bottom: 8px;
        }

        .toc-entry .toc-title {
            font-weight: 600;
            text-transform: uppercase;
        }

        .toc-entry .toc-dots {
            flex: 1;
            border-bottom: 1px dotted #666;
            margin: 0 8px;
        }

        /* Format Tabel Elegan (Header Hitam Tipis / Minimalis Sesuai Permintaan) */
        table {
            width: 100% !important;
            border-collapse: collapse !important;
            margin: 20px 0 !important;
            font-size: 8.5pt !important;
            font-family: var(--font-body) !important;
        }

        th {
            background-color: #222222 !important;
            color: #ffffff !important;
            font-family: var(--font-title) !important;
            font-weight: 600 !important;
            text-align: left !important;
            padding: 8px 10px !important;
            border: 1px solid #222 !important;
        }

        td {
            border: 1px solid #cccccc !important;
            padding: 7px 10px !important;
            vertical-align: top !important;
        }

        tr:nth-child(even) td {
            background-color: #f9f9f9;
        }

        /* Format Angka Rujukan Footnote Dalam Teks */
        sup.footnote-ref {
            font-size: 0.7em;
            vertical-align: super;
            line-height: 0;
            font-weight: bold;
            padding: 0 2px;
        }

        /* Format Footnote Di Bagian Bawah Halaman (Sesuai Gambar 5) */
        .footnote-item {
            font-family: var(--font-body);
            font-size: 7.5pt;
            line-height: 1.5;
            color: #333;
            margin-top: 4px;
            text-indent: 0;
            text-align: justify;
        }

        /* ==========================================================================
           3. ATURAN HALAMAN BUKU (A5 PAGE MARGINS & PRINT CLEANING)
           ========================================================================== */
        @page {
            size: A5;
            margin: 20mm 15mm 20mm 15mm;

            @bottom-center {
                content: counter(page);
                font-family: 'Cinzel', serif;
                font-size: 9pt;
            }
        }

        /* Area Footnote Otomatis Di Bawah Halaman Oleh Paged.js */
        @page {
            @footnote {
                border-top: 0.5pt solid #333;
                padding-top: 8px;
                margin-top: 15px;
            }
        }

        @media print {
            .control-panel { display: none !important; }
            #render-output { margin-top: 0 !important; padding: 0 !important; }
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <div style="color:#c5a059; font-weight:bold; font-family:'Cinzel',serif;">✨ BUKU PROFESIONAL ENGINE</div>
        <div>
            <label class="btn-upload">
                📂 Upload DOCX
                <input type="file" id="docxInput" accept=".docx">
            </label>
            <button class="btn-action" onclick="window.print()">🖨️ Cetak / Simpan PDF</button>
        </div>
    </div>

    <div id="render-output">
        <div id="book-src">
            <div class="book-title-header">
                <h1>Pratinjau Dokumen</h1>
                <div class="author-name">Silakan upload file .docx Anda</div>
            </div>
            <p>Sistem akan memformat ulang dokumen secara rapi: Judul seimbang, Daftar Isi bersih tanpa warna biru, Tabel ber-header hitam tipis elegan, serta Footnote yang otomatis mengunci di bagian paling bawah halaman.</p>
        </div>
    </div>

    <script>
        document.getElementById('docxInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                mammoth.convertToHtml({arrayBuffer: event.target.result})
                    .then(cleanAndFormatDocument)
                    .catch(err => alert("Gagal membaca file: " + err.message));
            };
            reader.readAsArrayBuffer(file);
        });

        function cleanAndFormatDocument(result) {
            let rawHtml = result.value;
            let parser = new DOMParser();
            let doc = parser.parseFromString(rawHtml, 'text/html');

            let outputContainer = document.createElement('div');
            let elements = doc.body.children;

            let inToc = false;

            for (let i = 0; i < elements.length; i++) {
                let el = elements[i];
                let text = el.innerText.trim();

                // 1. Bersihkan Judul Utama / Bab
                if (el.tagName === 'H1' || el.tagName === 'H2') {
                    if (text.toUpperCase().includes("DAFTAR ISI")) {
                        inToc = true;
                        let tocHeader = document.createElement('div');
                        tocHeader.className = 'book-title-header';
                        tocHeader.innerHTML = `<h1>DAFTAR ISI</h1>`;
                        outputContainer.appendChild(tocHeader);
                        continue;
                    }

                    inToc = false;
                    let chapterHeader = document.createElement('div');
                    chapterHeader.className = 'book-title-header';
                    chapterHeader.innerHTML = `<h1>${text}</h1>`;
                    outputContainer.appendChild(chapterHeader);
                } 
                // 2. Format Daftar Isi Rapi Tanpa Warna Biru
                else if (inToc && el.tagName === 'P') {
                    if (text !== '') {
                        let tocItem = document.createElement('div');
                        tocItem.className = 'toc-entry';
                        
                        // Pisahkan judul dan nomor halaman jika ada
                        let pageMatch = text.match(/(.*?)\s*(\d+)$/);
                        if (pageMatch) {
                            tocItem.innerHTML = `<span class="toc-title">${pageMatch[1]}</span><span class="toc-dots"></span><span>${pageMatch[2]}</span>`;
                        } else {
                            tocItem.innerHTML = `<span class="toc-title">${text}</span>`;
                        }
                        outputContainer.appendChild(tocItem);
                    }
                }
                // 3. Format Tabel Rapi Dengan Header Hitam Tipis
                else if (el.tagName === 'TABLE') {
                    inToc = false;
                    let table = el.cloneNode(true);
                    
                    // Pastikan baris pertama tabel diubah jadi TH (Header)
                    let firstRow = table.querySelector('tr');
                    if (firstRow) {
                        let cells = firstRow.querySelectorAll('td, th');
                        cells.forEach(cell => {
                            let th = document.createElement('th');
                            th.innerHTML = cell.innerHTML;
                            cell.replaceWith(th);
                        });
                    }
                    outputContainer.appendChild(table);
                }
                // 4. Format Paragraf & Footnote
                else if (el.tagName === 'P') {
                    inToc = false;
                    if (text !== '') {
                        let p = document.createElement('p');
                        p.innerHTML = el.innerHTML;
                        outputContainer.appendChild(p);
                    }
                } else {
                    outputContainer.appendChild(el.cloneNode(true));
                }
            }

            // Rendert ulang tampilan dengan Paged.js
            let srcContainer = document.getElementById('book-src');
            srcContainer.innerHTML = outputContainer.innerHTML;

            // Jalankan Paged.js untuk membagi halaman A5 dan menyusun Footnote di bawah
            window.PagedPolyfill.preview();
        }
    </script>
</body>
</html>
